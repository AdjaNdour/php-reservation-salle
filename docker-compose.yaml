services:
  mysql:
    image: mysql:8.0
    container_name: reservation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "reservation_salles"
      MYSQL_USER: "adja"
      MYSQL_PASSWORD: "008088"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: reservation-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation-web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html/src
      - ./public:/var/www/html/public
      - ./templates:/var/www/html/templates
      - ./config:/var/www/html/config
      - ./.env:/var/www/html/.env
    environment:
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: "reservation_salles"
      DB_USERNAME: "adja"
      DB_PASSWORD: "008088"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge